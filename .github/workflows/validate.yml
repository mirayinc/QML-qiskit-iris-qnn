name: Validate public archive

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-simulation:
    name: Validate and audit (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: qiskit1
            requirements: requirements.txt
          - environment: qiskit2
            requirements: requirements-qiskit2.txt
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements-security.txt
      - name: Upgrade package installer
        run: python -m pip install --upgrade 'pip>=26.2'
      - name: Install selected environment and security scanner
        run: python -m pip install -r '${{ matrix.requirements }}' -r requirements-security.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Audit installed packages for known vulnerabilities
        run: python -m pip_audit --local --strict
      - name: Validate notebooks, data and documentation
        run: python scripts/validate_archive.py
      - name: Exercise selected Aer training cells without IBM access
        if: matrix.environment == 'qiskit1'
        run: python scripts/smoke_simulation.py
      - name: Check Qiskit 2 imports and local Aer execution
        if: matrix.environment == 'qiskit2'
        run: python scripts/smoke_qiskit2.py
